name: Market News Bot

on:
  schedule:
    - cron: '0 11 * * *'   # 7:00 AM EST daily
  workflow_dispatch:        # allows manual trigger

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # ✅ STEP 1 — Run the bot and capture output
      - name: Run market bot
        id: run_bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LAST_MESSAGE_ID: ${{ vars.LAST_MESSAGE_ID }}
        run: python market_bot.py | tee bot_output.txt

      # ✅ STEP 2 — Save the new message ID for tomorrow's delete
      - name: Save message ID for tomorrow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESSAGE_ID=$(grep "NEW_MESSAGE_ID=" bot_output.txt | cut -d= -f2)
          if [ -n "$MESSAGE_ID" ]; then
            gh variable set LAST_MESSAGE_ID --body "$MESSAGE_ID"
            echo "Saved message ID: $MESSAGE_ID"
          else
            echo "No message ID found, skipping."
          fi
