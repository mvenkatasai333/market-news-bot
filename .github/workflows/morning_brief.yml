name: Run Daily Discord Market Bot

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # FIX: Explicitly grants the automated engine clearance to update your tracker file
    permissions:
      contents: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required scrapers
        run: pip install requests beautifulsoup4

      - name: Execute market bot (Clean & Post)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python market_bot.py

      # Auto-commits the tracking file back into your repository
      - name: Save tracking ID to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "System sync: updated last message ID tracker"
          file_pattern: 'last_message_id.txt'
